name: test
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    # A hung browser test file otherwise holds the job to GitHub's 6-hour cap (flag #84).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium firefox --no-shell
      - run: npm run lint
      - run: npm test
        env:
          STORYBENCH_SLIDE_FIT_EVIDENCE: ${{ runner.temp }}/slide-fit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slide-fit
          path: ${{ runner.temp }}/slide-fit
          if-no-files-found: error
  release-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile --target app --provenance=false --sbom=false -t storybench-ci-app .
      - run: docker build -f docker/Dockerfile --target worker --provenance=false --sbom=false -t storybench-ci-worker .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/inference-image-proof.mjs "$(docker image inspect storybench-ci-worker --format '{{.Id}}')"
      - name: Probe and smoke exact release images
        run: |
          set -eu
          app_image=$(docker image inspect storybench-ci-app --format '{{.Id}}')
          worker_image=$(docker image inspect storybench-ci-worker --format '{{.Id}}')
          for role in app worker; do
            if [ "$role" = app ]; then image="$app_image"; else image="$worker_image"; fi
            printf '%s image %s\n' "$role" "$image"
            docker run --rm --network none "$image" node /opt/storybench/app/src/runtime/image-check.js probe "$role"
            docker run --rm --network none "$image" node /opt/storybench/app/src/runtime/image-check.js smoke
            docker run --rm --network none --memory 1536m --pids-limit 256 "$image" node /opt/storybench/app/src/runtime/deck-check.js "$role"
            if [ "$role" = app ]; then
              docker run --rm --network none --memory 1536m --pids-limit 256 "$image" node /opt/storybench/app/src/runtime/deck-startup-check.js --require-ready
              docker run --rm --network none --memory 1536m --pids-limit 256 "$image" node /opt/storybench/app/src/runtime/deck-qa-loop-check.js
              mkdir -p demo-artifacts
              docker run --rm --network none --memory 1536m --pids-limit 256 --user "$(id -u):$(id -g)" --mount "type=bind,src=$PWD/demo-artifacts,dst=/evidence" "$image" node /opt/storybench/app/src/runtime/deck-demo-check.js /evidence
              test -r demo-artifacts/workspace/storybench.sqlite
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: editable-svg-deck-${{ github.sha }}
          path: demo-artifacts/
          if-no-files-found: error
